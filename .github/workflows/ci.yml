name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: splitbill
          POSTGRES_PASSWORD: splitbill
          POSTGRES_DB: splitbill
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U splitbill -d splitbill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://splitbill:splitbill@localhost:5436/splitbill
      DIRECT_URL: postgresql://splitbill:splitbill@localhost:5436/splitbill
      RECEIPT_PARSER: mock
      STORAGE: local
      WEB_ORIGIN: http://localhost:3030
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @splitbill/api prisma:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
