services:
  postgres:
    image: postgres:16-alpine
    container_name: splitbill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: splitbill
      POSTGRES_PASSWORD: splitbill
      POSTGRES_DB: splitbill
    ports:
      - "5436:5432"
    volumes:
      - splitbill_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitbill -d splitbill"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  splitbill_pg_data:
